name: Temporary Recover Sequential Stage 2 V2

on:
  push:
    branches:
      - 'research/lrc-adverse-portfolio-20260903'
    paths:
      - 'research/family_search/recover_stage2_v2.py'
      - '.github/workflows/recover-sequential-stage2-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/lrc-adverse-portfolio-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python research/family_search/recover_stage2_v2.py
      - name: Commit recovered source and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/recovered
          git commit -m 'chore(research): publish recovered stage-two metadata' || exit 0
          git push origin HEAD:research/lrc-adverse-portfolio-20260903
