name: Temporary LRC Adverse Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/adverse/**'
      - '.github/workflows/lrc-adverse-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore public M1 cache
        uses: actions/cache@v4
        with:
          path: research/cache/fxcm
          key: fxcm-public-m1-weekly-v1
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests numba pyarrow
      - name: Run adverse smoke test
        run: >-
          python research/adverse/adverse_engine.py
          --year 2020
          --cache-dir research/cache/fxcm
          --output-dir research/output_adverse/2020
          --swap-csv research/adverse/swap_rates_actual_2026.csv
          --policy-json research/adverse/smoke_policies.json
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrc-adverse-smoke
          path: research/output_adverse/**
          if-no-files-found: warn
          retention-days: 5
