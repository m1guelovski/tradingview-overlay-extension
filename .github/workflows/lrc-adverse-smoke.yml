name: Temporary LRC Adverse Phase 3 Sizing

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/adverse/**'
      - '.github/workflows/lrc-adverse-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  validate:
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        year: [2012, 2015, 2016, 2017, 2018, 2020, 2022, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore public M1 cache
        uses: actions/cache@v4
        with:
          path: research/cache/fxcm
          key: fxcm-public-m1-weekly-v1
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests numba pyarrow
      - name: Run targeted sizing and exposure grid
        run: >-
          python research/adverse/adverse_engine.py
          --year ${{ matrix.year }}
          --cache-dir research/cache/fxcm
          --output-dir research/output_adverse_phase3/${{ matrix.year }}
          --swap-csv research/adverse/swap_rates_actual_2026.csv
          --policy-json research/adverse/phase3_policies.json
          --horizon-days 300
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lrc-adverse-phase3-${{ matrix.year }}
          path: research/output_adverse_phase3/${{ matrix.year }}/**
          if-no-files-found: warn
          retention-days: 7
