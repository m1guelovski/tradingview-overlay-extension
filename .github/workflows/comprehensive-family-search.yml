name: Temporary Comprehensive Strategy Family Search

on:
  push:
    branches:
      - 'research/lrc-adverse-portfolio-20260903'
    paths:
      - 'research/family_search/stage2_auto_runner.py'
      - '.github/workflows/comprehensive-family-search.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/lrc-adverse-portfolio-20260903
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore public M1 cache
        uses: actions/cache@v4
        with:
          path: research/cache/fxcm
          key: fxcm-public-m1-weekly-v1
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy pyarrow requests tabulate numba xlsxwriter
      - name: Recover valid stage-two implementation
        run: python research/family_search/recover_stage2_v2.py
      - name: Aggregate stage-one families
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/family_search/stage1_aggregate.py
      - name: Run sequential portfolio finalists
        run: python research/family_search/stage2_auto_runner.py
      - name: Commit comprehensive outputs
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/recovered research/results/stage1_aggregate research/results/sequential_stage2_auto || true
          git commit -m 'chore(research): publish comprehensive family search' || exit 0
          git push origin HEAD:research/lrc-adverse-portfolio-20260903
