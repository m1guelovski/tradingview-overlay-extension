name: Temporary LRC Family V2

on:
  push:
    branches:
      - research/lrc-family-v2-20260903
    paths:
      - 'research/v2/**'
      - '.github/workflows/lrc-family-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: '1'

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/lrc-family-v2-20260903
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore public M1 cache
        uses: actions/cache@v4
        with:
          path: research/cache/fxcm
          key: fxcm-public-m1-weekly-v1
      - name: Inspect cache
        run: python research/v2/inspect_cache.py
      - name: Commit results
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/results_v2
          git diff --cached --quiet || git commit -m 'chore(research): publish cache inventory [skip ci]'
          git push origin HEAD:research/lrc-family-v2-20260903
