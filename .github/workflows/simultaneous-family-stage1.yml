name: Temporary Simultaneous Family Stage 1

on:
  push:
    branches:
      - 'research/lrc-adverse-portfolio-20260903'
    paths:
      - 'research/family_search/simultaneous_family_stage1.py'
      - '.github/workflows/simultaneous-family-stage1.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: '1'

jobs:
  screen:
    strategy:
      fail-fast: false
      matrix:
        year: [2012, 2015, 2016, 2017, 2018, 2020, 2022, 2024]
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore public M1 cache
        uses: actions/cache@v4
        with:
          path: research/cache/fxcm
          key: fxcm-public-m1-weekly-v1
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests numba pyarrow
      - name: Screen simultaneous strategy families
        run: >-
          python research/family_search/simultaneous_family_stage1.py
          --year ${{ matrix.year }}
          --cache-dir research/cache/fxcm
          --output-dir research/output_simultaneous_stage1/${{ matrix.year }}
          --swap-csv research/adverse/swap_rates_actual_2026.csv
      - name: Upload year result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simultaneous-family-stage1-${{ matrix.year }}
          path: research/output_simultaneous_stage1/${{ matrix.year }}/**
          if-no-files-found: warn
          retention-days: 5
