name: Temporary Stage 1 Artifact Inventory

on:
  push:
    branches:
      - 'research/lrc-adverse-portfolio-20260903'
    paths:
      - 'research/family_search/aggregate_artifacts.py'
      - '.github/workflows/stage1-artifact-inventory.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/lrc-adverse-portfolio-20260903
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas pyarrow requests
      - name: Inspect stage-one artifacts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python research/family_search/aggregate_artifacts.py
      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/results/stage1_inventory
          git commit -m 'chore(research): publish stage-one inventory' || exit 0
          git push origin HEAD:research/lrc-adverse-portfolio-20260903
