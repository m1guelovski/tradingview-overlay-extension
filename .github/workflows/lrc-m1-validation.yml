name: Temporary LRC M1 Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'research/**'
      - '.github/workflows/lrc-m1-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy requests xlsxwriter
      - name: Run M1 validation
        run: python research/lrc_m1_validation.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: lrc-m1-validation-results
          path: research/output/**
          if-no-files-found: error
          retention-days: 3
